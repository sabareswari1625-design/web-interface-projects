name: Deploy Web Interface Projects

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create site folder
        run: mkdir -p _site

      - name: Build Attendance Tracker
        run: |
          cd Attendancetracker
          npm install
          npm run build -- --base=/web-interface-projects/Attendancetracker/ --outDir=$GITHUB_WORKSPACE/_site/Attendancetracker

      - name: Build Calculator
        run: |
          cd calculatorproject
          npm install
          npm run build -- --base=/web-interface-projects/calculatorproject/ --outDir=$GITHUB_WORKSPACE/_site/calculatorproject

      - name: Copy Counter App
  run: |
   mkdir -p _site/counterapp
    cp counterapp/counter.html _site/counterapp/index.html

      - name: Build Form Validation
        run: |
          cd formvalidation/formvalidation
          npm install
          npm run build -- --base=/web-interface-projects/formvalidation/ --outDir=$GITHUB_WORKSPACE/_site/formvalidation

      - name: Build Hobby Card
        run: |
          cd hobbycard/hobbycard
          npm install
          npm run build -- --base=/web-interface-projects/hobbycard/ --outDir=$GITHUB_WORKSPACE/_site/hobbycard

      - name: Build Portfolio
        run: |
          cd portfolioproject/portfolioproject
          npm install
          npm run build -- --base=/web-interface-projects/portfolioProject/ --outDir=$GITHUB_WORKSPACE/_site/portfolioProject

      - name: Build Report Card
        run: |
          cd reportcard/reportcard
          npm install
          npm run build -- --base=/web-interface-projects/reportcard/ --outDir=$GITHUB_WORKSPACE/_site/reportcard

      - name: Build Student Profile
        run: |
          cd studentprofile/studentprofile
          npm install
          npm run build -- --base=/web-interface-projects/studentprofile/ --outDir=$GITHUB_WORKSPACE/_site/studentprofile

      - name: Copy Student Dashboard
        run: |
          mkdir -p _site/studentdashboard
          cp -R studentdashboard/. _site/studentdashboard/

      - name: Build Todo App
        run: |
          cd todoapp/todoapp
          npm install
          npm run build -- --base=/web-interface-projects/todoapp/ --outDir=$GITHUB_WORKSPACE/_site/todoapp

      - name: Copy Root Website
        run: |
          cp index.html _site/index.html
          cp style.css _site/style.css

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4