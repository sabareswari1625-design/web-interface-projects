name: Deploy Web Interface Projects

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Attendance Tracker
      - name: Build Attendance Tracker
        run: |
          cd Attendancetracker
          npm install
          npm run build -- --base=/web-interface-projects/Attendancetracker/
          mkdir -p $GITHUB_WORKSPACE/_site/Attendancetracker
          cp -R dist/* $GITHUB_WORKSPACE/_site/Attendancetracker/

      # Calculator
      - name: Build Calculator
        run: |
          cd calculatorproject
          npm install
          npm run build -- --base=/web-interface-projects/calculatorproject/
          mkdir -p $GITHUB_WORKSPACE/_site/calculatorproject
          cp -R dist/* $GITHUB_WORKSPACE/_site/calculatorproject/

      # Counter App
      - name: Copy Counter App
        run: |
          mkdir -p $GITHUB_WORKSPACE/_site/counterapp
          cp counterapp/counter.html $GITHUB_WORKSPACE/_site/counterapp/index.html

      # Form Validation
      - name: Build Form Validation
        run: |
          cd formvalidation/formvalidation
          npm install
          npm run build -- --base=/web-interface-projects/formvalidation/formvalidation/
          mkdir -p $GITHUB_WORKSPACE/_site/formvalidation/formvalidation
          cp -R dist/* $GITHUB_WORKSPACE/_site/formvalidation/formvalidation/

      # Hobby Card
      - name: Build Hobby Card
        run: |
          cd hobbycard/hobbycard
          npm install
          npm run build -- --base=/web-interface-projects/hobbycard/
          mkdir -p $GITHUB_WORKSPACE/_site/hobbycard
          cp -R dist/* $GITHUB_WORKSPACE/_site/hobbycard/

      - name: Build Portfolio
  run: |
    echo "Checking portfolio files..."
    find . -maxdepth 4 -name package.json -print

    if [ -f "portfolioProject/package.json" ]; then
      cd portfolioProject
    elif [ -f "portfolioProject/portfolioProject/package.json" ]; then
      cd portfolioProject/portfolioProject
    else
      echo "Portfolio package.json not found"
      exit 1
    fi

    npm install
    npm run build

    mkdir -p "$GITHUB_WORKSPACE/_site/portfolioProject"
    cp -R dist/* "$GITHUB_WORKSPACE/_site/portfolioProject/"

      # Report Card
      - name: Build Report Card
        run: |
          cd reportcard/reportcard
          npm install
          npm run build -- --base=/web-interface-projects/reportcard/
          mkdir -p $GITHUB_WORKSPACE/_site/reportcard
          cp -R dist/* $GITHUB_WORKSPACE/_site/reportcard/

      # Student Dashboard
      - name: Build Student Dashboard
        run: |
          cd studentdashboard/studentdashboard
          npm install
          npm run build -- --base=/web-interface-projects/studentdashboard/
          mkdir -p $GITHUB_WORKSPACE/_site/studentdashboard
          cp -R dist/* $GITHUB_WORKSPACE/_site/studentdashboard/

      # Student Profile
      - name: Build Student Profile
        run: |
          cd studentprofile/studentprofile
          npm install
          npm run build -- --base=/web-interface-projects/studentprofile/
          mkdir -p $GITHUB_WORKSPACE/_site/studentprofile
          cp -R dist/* $GITHUB_WORKSPACE/_site/studentprofile/

      # Todo App
      - name: Build Todo App
        run: |
          cd todoapp/todoapp
          npm install
          npm run build -- --base=/web-interface-projects/todoapp/
          mkdir -p $GITHUB_WORKSPACE/_site/todoapp
          cp -R dist/* $GITHUB_WORKSPACE/_site/todoapp/

      # Root website
      - name: Copy Root Website
        run: |
          cp index.html $GITHUB_WORKSPACE/_site/
          cp style.css $GITHUB_WORKSPACE/_site/

      # GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4