<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(to right,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    padding:30px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
    width:300px;
}

h1{
    color:#333;
    margin-bottom:20px;
}

#count{
    font-size:60px;
    color:#007BFF;
    margin:20px 0;
    font-weight:bold;
}

button{
    padding:10px 20px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    color:white;
    transition:0.3s;
}

.increase{
    background:green;
}

.decrease{
    background:red;
}

.reset{
    background:orange;
}

button:hover{
    transform:scale(1.05);
}
</style>

</head>

<body>

<div class="container">

    <h1>Counter App</h1>

    <div id="count">0</div>

    <button class="increase"
    onclick="increase()">Increase</button>

    <button class="decrease"
    onclick="decrease()">Decrease</button>

    <button class="reset"
    onclick="resetCounter()">Reset</button>

</div>

<script>

let count = 0;

function increase(){
    count++;
    document.getElementById("count").innerHTML = count;
}

function decrease(){
    count--;
    document.getElementById("count").innerHTML = count;
}

function resetCounter(){
    count = 0;
    document.getElementById("count").innerHTML = count;
}

</script>

</body>
</html>
